<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Companion Character V6</title><style>
html,body{margin:0;height:100%;overflow:hidden;background:#061019;color:#eefaff;font-family:system-ui}
canvas{display:block;width:100%;height:100%}#status{position:fixed;top:10px;left:10px;right:10px;padding:11px 14px;border-radius:14px;background:#03101add;z-index:4;font-size:13px}
#chat{position:fixed;bottom:12px;left:12px;right:12px;display:flex;gap:8px;z-index:4}
input{flex:1;padding:13px;border:1px solid #456;border-radius:16px;background:#07121ddd;color:white;font-size:16px}button{border:0;border-radius:16px;padding:0 18px;background:#64ddff;font-weight:800}
</style></head><body><div id="status">AI Companion / キャラクターV6 / 読み込み中</div>
<div id="chat"><input id="q" placeholder="話しかけてください"><button id="send">送信</button></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script>
<script type="module">
const THREE=await import('three');const{GLTFLoader}=await import('three/addons/loaders/GLTFLoader.js');
const scene=new THREE.Scene();scene.background=new THREE.Color(0x061019);
const camera=new THREE.PerspectiveCamera(30,innerWidth/innerHeight,.01,100);camera.position.set(0,3.55,7.9);camera.lookAt(0,3.55,0);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xeaf8ff,0x183047,2.4));const key=new THREE.DirectionalLight(0xffffff,2.7);key.position.set(3,7,6);scene.add(key);
const rim=new THREE.PointLight(0x39dfff,2.4,10);rim.position.set(-3,4,2);scene.add(rim);
const status=document.getElementById('status');new GLTFLoader().load('./ai_companion_character_v6.glb',g=>{
const model=g.scene;scene.add(model);status.textContent='AI Companion / キャラクターV6 / 実体メッシュ3Dモデル表示中';let t=0;
function loop(){t+=.016;model.rotation.y=Math.sin(t*.28)*.025;model.position.y=Math.sin(t*1.1)*.006;renderer.render(scene,camera);requestAnimationFrame(loop)}loop();
},undefined,e=>status.textContent='GLB読み込みエラー：'+e.message);
document.getElementById('send').onclick=()=>{let v=document.getElementById('q').value.trim();if(v){status.textContent='受信：'+v;document.getElementById('q').value=''}};
document.getElementById('q').onkeydown=e=>{if(e.key==='Enter')document.getElementById('send').click()};
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
