<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Companion</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#07101c;color:white;font-family:system-ui}#stage{height:100%;position:relative}canvas{display:block;width:100%;height:100%}#chat{position:absolute;bottom:12px;left:12px;right:12px;display:flex;gap:8px}input,button{border:1px solid #45677f;border-radius:18px;background:#0b1929e8;color:white;padding:11px}input{flex:1}</style></head>
<body><div id="stage"><div id="chat"><input id="input" placeholder="話しかけてください"><button id="send">送信</button></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
const stage=document.getElementById('stage'),scene=new THREE.Scene();
scene.background=new THREE.Color(0x07101c);
const camera=new THREE.PerspectiveCamera(35,innerWidth/innerHeight,.1,100);camera.position.set(0,1.4,5);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));stage.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xccefff,0x182238,2.2));
const l=new THREE.DirectionalLight(0xffffff,3);l.position.set(3,5,4);scene.add(l);
const root=new THREE.Group();scene.add(root);
const skin=new THREE.MeshStandardMaterial({color:0xf1d8cf,roughness:.7}), hair=new THREE.MeshStandardMaterial({color:0xdce8f0,roughness:.45}), suit=new THREE.MeshStandardMaterial({color:0xe7edf2,roughness:.55}), dark=new THREE.MeshStandardMaterial({color:0x172637}), cyan=new THREE.MeshStandardMaterial({color:0x72eaff,emissive:0x0b647a,emissiveIntensity:2}), eye=new THREE.MeshStandardMaterial({color:0xa8f7ff,emissive:0x2bd8ee,emissiveIntensity:3});
function add(g,m,p,s=[1,1,1]){let o=new THREE.Mesh(g,m);o.position.set(...p);o.scale.set(...s);root.add(o);return o}
add(new THREE.SphereGeometry(.48,32,24),skin,[0,2.15,0],[.94,1.06,.86]);
add(new THREE.SphereGeometry(.53,32,20),hair,[0,2.4,-.02],[1.03,.72,.92]);
for(let x of [-.18,.18])add(new THREE.SphereGeometry(.07,20,16),eye,[x,2.18,.42],[1,1,.35]);
for(let x of [-.38,-.19,0,.19,.38]){let o=add(new THREE.ConeGeometry(.13,.7,20),hair,[x,2.22,.28]);o.rotation.z=-x*.3}
for(let x of [-.44,.44])add(new THREE.CylinderGeometry(.1,.065,.95,20),hair,[x,1.98,0]);
add(new THREE.CylinderGeometry(.16,.18,.22,24),skin,[0,1.53,0]);
add(new THREE.CylinderGeometry(.47,.58,1.2,32),suit,[0,.98,0]);
add(new THREE.BoxGeometry(.9,.14,.62),cyan,[0,1.34,.3],[1,.55,.22]);
for(let x of [-.68,.68]){let a=add(new THREE.CapsuleGeometry(.13,.7,8,16),suit,[x,.98,0]);a.rotation.z=x*.12;add(new THREE.SphereGeometry(.14,20,16),skin,[x,.51,0])}
for(let x of [-.22,.22]){add(new THREE.CapsuleGeometry(.14,.72,8,16),dark,[x,-.03,0]);add(new THREE.BoxGeometry(.3,.18,.58),suit,[x,-.48,.08])}
for(let x of [-.32,0,.32]){let p=add(new THREE.BoxGeometry(.27,.9,.12),dark,[x,.48,.18]);p.rotation.y=x*.25}
let ring=new THREE.Mesh(new THREE.TorusGeometry(1.15,.012,8,96),cyan);ring.position.y=1.2;ring.rotation.x=Math.PI/2;scene.add(ring);
function send(){let v=input.value.trim();if(!v)return;let t=/こんにちは|こんばんは|やあ/.test(v)?'こんにちは、オーナー。接続は正常です。':'了解しました、オーナー。少し考えてみます。';input.value='';let u=new SpeechSynthesisUtterance(t);u.lang='ja-JP';speechSynthesis.cancel();speechSynthesis.speak(u)}
document.getElementById('send').onclick=send;document.getElementById('input').addEventListener('keydown',e=>{if(e.key==='Enter')send()});
function loop(t){root.position.y=Math.sin(t*.0018)*.035;root.rotation.y=Math.sin(t*.0007)*.04;ring.rotation.z=t*.0002;renderer.render(scene,camera);requestAnimationFrame(loop)}requestAnimationFrame(loop);
onresize=()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}
</script></body></html>
