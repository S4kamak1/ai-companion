<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Companion V3</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071019;color:#eafaff;font-family:system-ui}canvas{display:block;width:100%;height:100%}#ui{position:fixed;z-index:5;top:10px;left:10px;right:10px;padding:10px 12px;border-radius:14px;background:#040c14b3;backdrop-filter:blur(8px);font-size:13px}#chat{position:fixed;z-index:5;bottom:12px;left:10px;right:10px;display:flex;gap:8px}input{flex:1;padding:12px;border-radius:14px;border:1px solid #456;background:#071019dd;color:white;font-size:16px}button{border:0;border-radius:14px;padding:0 16px;background:#72ddff;color:#06202a;font-weight:700}</style></head><body>
<div id="ui">キャラクターを読み込んでいます…</div><div id="chat"><input id="q" placeholder="話しかけてください"><button id="send">送信</button></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script>
<script type="module">const T=await import('three');const{GLTFLoader}=await import('three/addons/loaders/GLTFLoader.js');const ui=document.getElementById('ui'),q=document.getElementById('q');const s=new T.Scene();s.background=new T.Color(0x071019);const c=new T.PerspectiveCamera(34,innerWidth/innerHeight,.01,100);c.position.set(0,1.42,5.6);c.lookAt(0,1.38,0);const r=new T.WebGLRenderer({antialias:true});r.setPixelRatio(Math.min(devicePixelRatio,2));r.setSize(innerWidth,innerHeight);r.outputColorSpace=T.SRGBColorSpace;document.body.appendChild(r.domElement);s.add(new T.HemisphereLight(0xeafaff,0x17344a,2.1));const d=new T.DirectionalLight(0xffffff,2.3);d.position.set(2.5,4.5,5);s.add(d);const p=new T.PointLight(0x55ddff,2,8);p.position.set(-2,2.5,1);s.add(p);new GLTFLoader().load('./ai_companion_character_v3.glb',g=>{const m=g.scene;s.add(m);ui.textContent='AI Companion / キャラクターV3 / 実体メッシュ表示中';let t=0;function a(){t+=.016;m.rotation.y=Math.sin(t*.35)*.035;m.position.y=Math.sin(t*1.25)*.006;r.render(s,c);requestAnimationFrame(a)}a()},undefined,e=>ui.textContent='読み込みエラー：'+e.message);document.getElementById('send').onclick=()=>{if(q.value.trim()){ui.textContent='受信：'+q.value.trim();q.value=''}};q.onkeydown=e=>{if(e.key==='Enter')document.getElementById('send').click()};addEventListener('resize',()=>{c.aspect=innerWidth/innerHeight;c.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)});</script></body></html>
