<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GLB診断 v2</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#081018;color:#dff;font-family:sans-serif}
#status{position:fixed;z-index:10;left:10px;right:10px;top:10px;padding:12px;background:rgba(0,0,0,.84);border-radius:10px;white-space:pre-wrap;line-height:1.5}
canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<div id="status">診断 v2を開始しています…</div>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
  }
}
</script>
<script type="module">
const status=document.getElementById('status');
const show=s=>status.textContent=s;

try{
  const THREE=await import('three');
  const {GLTFLoader}=await import('three/addons/loaders/GLTFLoader.js');

  const scene=new THREE.Scene();
  scene.background=new THREE.Color(0x081018);

  const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.01,1000);
  camera.position.set(0,1.5,5);

  const renderer=new THREE.WebGLRenderer({antialias:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(innerWidth,innerHeight);
  document.body.appendChild(renderer.domElement);

  scene.add(new THREE.HemisphereLight(0xffffff,0x204060,2));
  const light=new THREE.DirectionalLight(0xffffff,2);
  light.position.set(2,4,5);
  scene.add(light);

  const test=new THREE.Mesh(
    new THREE.SphereGeometry(.45,24,24),
    new THREE.MeshStandardMaterial({color:0x4fdcff})
  );
  test.position.set(0,.8,0);
  scene.add(test);

  show('Three.js：OK\nGLTFLoader：OK\nGLBファイルを取得しています…');

  const loader=new GLTFLoader();
  loader.load(
    './ai_companion_real3d_v1.glb',
    gltf=>{
      scene.remove(test);
      const model=gltf.scene;
      scene.add(model);

      const box=new THREE.Box3().setFromObject(model);
      const size=box.getSize(new THREE.Vector3());
      const center=box.getCenter(new THREE.Vector3());
      model.position.sub(center);

      const maxSize=Math.max(size.x,size.y,size.z);
      if(maxSize>0) model.scale.setScalar(2.5/maxSize);

      let meshCount=0;
      model.traverse(o=>{if(o.isMesh)meshCount++;});

      show(
        'GLB読み込み成功。\n'+
        '実体メッシュ数：'+meshCount+'\n'+
        '画面中央にモデルを表示しています。'
      );

      function animate(){
        model.rotation.y+=0.003;
        renderer.render(scene,camera);
        requestAnimationFrame(animate);
      }
      animate();
    },
    xhr=>{
      const p=xhr.total ? Math.round(xhr.loaded/xhr.total*100)+'%' : xhr.loaded+' bytes';
      show('GLBを読み込み中… '+p);
    },
    err=>{
      show(
        'GLB読み込み失敗。\n\n'+
        'Three.js：OK\n'+
        'GLTFLoader：OK\n'+
        '対象：ai_companion_real3d_v1.glb\n\n'+
        'エラー：'+(err?.message||String(err))
      );
      function animate(){
        test.rotation.y+=0.01;
        renderer.render(scene,camera);
        requestAnimationFrame(animate);
      }
      animate();
    }
  );

  addEventListener('resize',()=>{
    camera.aspect=innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth,innerHeight);
  });
}catch(e){
  show('診断プログラム自体のエラー：\n'+(e?.message||String(e)));
}
</script>
</body>
</html>
