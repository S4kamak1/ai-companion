<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>AI Companion · APEIRIA 2.5D</title>
<meta name="theme-color" content="#090b12">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#061019;color:#eefaff;font-family:system-ui}
canvas{display:block;width:100%;height:100%}
#status{position:fixed;top:10px;left:10px;right:10px;padding:11px 14px;border-radius:14px;background:#03101ddd;z-index:5;font-size:13px}
#chat{position:fixed;bottom:12px;left:12px;right:12px;display:flex;gap:8px;z-index:5}
input{min-width:0;flex:1;padding:13px;border:1px solid #456;border-radius:16px;background:#07121ddd;color:#fff;font-size:16px}
button{border:0;border-radius:16px;padding:0 18px;background:#64ddff;font-weight:800}
</style></head>
<body>
<div id="status">AI Companion / APEIRIA 2.5D / 読み込み中</div>
<div id="chat"><input id="q" placeholder="話しかけてください"><button id="send">送信</button></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script>
<script type="module">
const THREE=await import('three');
const {GLTFLoader}=await import('three/addons/loaders/GLTFLoader.js');
const scene=new THREE.Scene();scene.background=new THREE.Color(0x061019);
const camera=new THREE.PerspectiveCamera(32,innerWidth/innerHeight,.01,100);
camera.position.set(0,0.05,6.0);camera.lookAt(0,0.05,0);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xeaf8ff,0x16253b,2.2));
const key=new THREE.DirectionalLight(0xffffff,2.8);key.position.set(3,7,6);scene.add(key);
const fill=new THREE.PointLight(0x49dfff,2.0,10);fill.position.set(-3,1,3);scene.add(fill);
const loader=new GLTFLoader(), status=document.getElementById('status');
let model=null, baseScale=1.45, t=0, pointerX=0, pointerY=0;
loader.load('./apeiria_front_2p5d_upright.glb',g=>{
  model=g.scene;model.scale.setScalar(baseScale);model.position.set(0,0.04,0);scene.add(model);
  status.textContent='AI Companion / APEIRIA 2.5D / 正面モデル表示中';
},undefined,e=>status.textContent='GLB読み込みエラー：'+e.message);
addEventListener('pointermove',e=>{
  pointerX=(e.clientX/innerWidth-.5)*2;
  pointerY=(e.clientY/innerHeight-.5)*2;
});
function loop(){
  t+=.016;
  if(model){
    model.rotation.y += (pointerX*.018-model.rotation.y)*.05;
    model.rotation.z += (Math.sin(t*.55)*.008-model.rotation.z)*.04;
    model.position.x += (pointerX*.025-model.position.x)*.04;
    model.position.y += (.04+Math.sin(t*.9)*.018-pointerY*.018-model.position.y)*.04;
    const breath=1+Math.sin(t*.9)*.002;
    model.scale.set(baseScale,baseScale*breath,baseScale);
  }
  renderer.render(scene,camera);requestAnimationFrame(loop)
}
loop();
document.getElementById('send').onclick=()=>{
  const q=document.getElementById('q');
  if(q.value.trim()){status.textContent='受信：'+q.value.trim();q.value=''}
};
document.getElementById('q').onkeydown=e=>{if(e.key==='Enter')document.getElementById('send').click()};
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{});}
</script></body></html>
