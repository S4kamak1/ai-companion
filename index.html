<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Companion Character V5</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#061019;color:#eafaff;font-family:system-ui,sans-serif}
canvas{display:block;width:100%;height:100%}
#ui{position:fixed;z-index:5;top:10px;left:10px;right:10px;padding:11px 13px;border-radius:14px;background:#030a12c4;backdrop-filter:blur(10px);font-size:13px}
#chat{position:fixed;z-index:5;bottom:12px;left:10px;right:10px;display:flex;gap:8px}
input{flex:1;min-width:0;padding:12px;border-radius:14px;border:1px solid #456;background:#071019dd;color:white;font-size:16px}
button{border:0;border-radius:14px;padding:0 16px;background:#72ddff;color:#06202a;font-weight:700}
</style></head><body>
<div id="ui">AI Companion / キャラクターV5 / 読み込み中</div>
<div id="chat"><input id="q" placeholder="話しかけてください"><button id="send">送信</button></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script>
<script type="module">
const T=await import('three');const{GLTFLoader}=await import('three/addons/loaders/GLTFLoader.js');
const ui=document.getElementById('ui'),q=document.getElementById('q');
const scene=new T.Scene();scene.background=new T.Color(0x061019);
const cam=new T.PerspectiveCamera(30,innerWidth/innerHeight,.01,100);cam.position.set(0,1.48,6.4);cam.lookAt(0,1.48,0);
const renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=T.SRGBColorSpace;document.body.appendChild(renderer.domElement);
scene.add(new T.HemisphereLight(0xf3fbff,0x142a3d,2.25));
const key=new T.DirectionalLight(0xffffff,2.8);key.position.set(2.5,4.5,5);scene.add(key);
const rim=new T.DirectionalLight(0x4bdcff,1.5);rim.position.set(-3,2,-3);scene.add(rim);
new GLTFLoader().load('./ai_companion_character_v5.glb',g=>{
 const model=g.scene;scene.add(model);
 ui.textContent='AI Companion / キャラクターV5 / 実体メッシュ3Dモデル表示中';
 let t=0;function loop(){t+=.016;model.rotation.y=Math.sin(t*.25)*.035;model.position.y=Math.sin(t*1.1)*.004;renderer.render(scene,cam);requestAnimationFrame(loop)}loop();
},undefined,e=>{ui.textContent='GLB読み込みエラー：'+e.message});
document.getElementById('send').onclick=()=>{if(q.value.trim()){ui.textContent='受信：'+q.value.trim();q.value=''}};
q.onkeydown=e=>{if(e.key==='Enter')document.getElementById('send').click()};
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
