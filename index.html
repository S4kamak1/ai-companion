<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>3D表示テスト</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#081018;color:#dff;font-family:sans-serif}
#status{position:fixed;z-index:10;left:10px;right:10px;top:10px;padding:12px;background:rgba(0,0,0,.8);border-radius:10px;white-space:pre-wrap}
canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<div id="status">Three.jsを起動しています…</div>
<script type="module">
const status=document.getElementById('status');
function show(s){status.textContent=s;}

try {
  const THREE = await import('https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js');
  show('Three.js 読み込み成功。3D空間を作成しています…');

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x081018);

  const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 100);
  camera.position.set(0, 1.2, 5);

  const renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(innerWidth,innerHeight);
  document.body.appendChild(renderer.domElement);

  const light = new THREE.HemisphereLight(0xffffff,0x204060,2);
  scene.add(light);

  const geometry = new THREE.SphereGeometry(0.8,32,32);
  const material = new THREE.MeshStandardMaterial({color:0x9fdcff});
  const mesh = new THREE.Mesh(geometry,material);
  mesh.position.y=1.2;
  scene.add(mesh);

  show('成功。\nThree.jsとWebGLは正常です。\n中央に3Dモデルのテスト球が表示されます。');

  function animate(){
    mesh.rotation.y += 0.01;
    renderer.render(scene,camera);
    requestAnimationFrame(animate);
  }
  animate();

  addEventListener('resize',()=>{
    camera.aspect=innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth,innerHeight);
  });
} catch(e) {
  show('Three.js / WebGL エラー:\n' + (e?.message || e));
}
</script>
</body>
</html>
