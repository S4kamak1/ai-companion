name: WebGL render report

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "webgl-blink-calibration.html"
      - "apeiria_front_2p5d_upright.glb"
      - ".github/workflows/webgl-render-report.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install browser and video tools
        run: |
          npm init -y
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Start static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/ai-companion-http.log 2>&1 &
          echo $! > /tmp/ai-companion-http.pid
      - name: Render actual WebGL frames
        run: |
          node <<'NODE'
          const { chromium } = require("playwright");
          const fs = require("node:fs");
          const { execFileSync } = require("node:child_process");
          const out = "render-output";
          const frames = out + "/frames";
          fs.rmSync(out, { recursive: true, force: true });
          fs.mkdirSync(frames, { recursive: true });
          (async () => {
          const pageErrors = [];
          const browser = await chromium.launch({
            headless: true,
            args: ["--use-angle=swiftshader", "--enable-unsafe-swiftshader", "--ignore-gpu-blocklist"]
          });
          try {
            const page = await browser.newPage({ viewport: { width: 860, height: 980 }, deviceScaleFactor: 1 });
            page.on("pageerror", error => pageErrors.push("pageerror: " + error.message));
            page.on("console", message => { if (message.type() === "error") pageErrors.push("console: " + message.text()); });
            await page.goto("http://127.0.0.1:4173/webgl-blink-calibration.html", { waitUntil: "networkidle", timeout: 120000 });
            await page.waitForFunction(() => {
              const button = document.querySelector("#normal");
              return button && !button.disabled;
            }, null, { timeout: 120000 });
            const webgl = await page.evaluate(() => {
              const canvas = document.querySelector("#gl");
              const gl = canvas && (canvas.getContext("webgl2") || canvas.getContext("webgl"));
              return {
                canvas: Boolean(canvas),
                webgl: Boolean(gl),
                renderer: gl ? gl.getParameter(gl.RENDERER) : "none",
                status: document.querySelector("#status")?.textContent || ""
              };
            });
            if (!webgl.webgl || !/WebGL表示準備完了/.test(webgl.status)) throw new Error("WebGL renderer was not ready: " + JSON.stringify(webgl));
            const appPage = await browser.newPage({ viewport: { width: 860, height: 980 }, deviceScaleFactor: 1 });
            const appErrors = [];
            appPage.on("pageerror", error => appErrors.push("pageerror: " + error.message));
            appPage.on("console", message => { if (message.type() === "error") appErrors.push("console: " + message.text()); });
            await appPage.goto("http://127.0.0.1:4173/index.html", { waitUntil: "networkidle", timeout: 120000 });
            await appPage.waitForFunction(() => /正面2.5Dモデル表示中/.test(document.querySelector("#stateText")?.textContent || ""), null, { timeout: 120000 });
            await appPage.waitForFunction(() => Boolean(window.__apeiriaBlinkDiagnostics?.().textureReady), null, { timeout: 120000 });
            const appStage = appPage.locator("#stage");
            await appPage.evaluate(() => window.__apeiriaBlinkTest(0));
            await appPage.waitForTimeout(300);
            await appStage.screenshot({ path: out + "/app-normal.png" });
            await appPage.evaluate(() => window.__apeiriaBlinkTest(1));
            await appPage.waitForTimeout(300);
            await appStage.screenshot({ path: out + "/app-both-closed.png" });
            await appPage.evaluate(() => window.__apeiriaBlinkTest(0));
            await appPage.evaluate(() => window.applyConversationEvent({ emotion: "happy", gesture: "positive", speaking: false }));
            await appPage.waitForTimeout(500);
            await appStage.screenshot({ path: out + "/app-positive.png" });
            const appDiagnostics = await appPage.evaluate(() => window.__apeiriaBlinkDiagnostics());
            const stage = page.locator(".stage");
            const diagnostics = {};
            async function capture(id, name) {
              await page.locator("#" + id).click();
              await page.waitForTimeout(180);
              await stage.screenshot({ path: out + "/" + name + ".png" });
              diagnostics[name] = await page.locator("#diag").textContent();
            }
            await capture("normal", "normal-debug");
            await capture("left", "left-closed-debug");
            await capture("right", "right-closed-debug");
            await capture("both", "both-closed-debug");
            await page.locator("#debug").uncheck();
            await capture("normal", "normal");
            await capture("left", "left-closed");
            await capture("right", "right-closed");
            await capture("both", "both-closed");
            await page.locator("#debug").check();
            await page.locator("#auto").click();
            for (let i = 0; i < 72; i++) {
              await page.waitForTimeout(42);
              await stage.screenshot({ path: frames + "/frame-" + String(i).padStart(3, "0") + ".png" });
            }
            execFileSync("ffmpeg", ["-y", "-framerate", "24", "-i", frames + "/frame-%03d.png", "-c:v", "libvpx-vp9", "-crf", "32", "-b:v", "0", "-pix_fmt", "yuv420p", out + "/blink.webm"], { stdio: "inherit" });
            execFileSync("ffmpeg", ["-y", "-i", out + "/blink.webm", "-vf", "fps=12,scale=480:-1:flags=lanczos", out + "/blink.gif"], { stdio: "inherit" });
            const report = {
              commit: process.env.GITHUB_SHA || "unknown",
              generatedAt: new Date().toISOString(),
              webgl,
              pageStatus: await page.locator("#status").textContent(),
              diagnostics,
              pageErrors,
              appDiagnostics,
              appErrors
            };
            fs.writeFileSync(out + "/report.json", JSON.stringify(report, null, 2));
            const esc = value => String(value).replace(/[&<>\"']/g, character => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[character]));
            fs.writeFileSync(out + "/index.html", "<!doctype html><html lang=\"ja\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>APEIRIA WebGL render report</title><style>body{margin:0;padding:20px;background:#07101a;color:#eaf7ff;font:14px system-ui,sans-serif}main{max-width:1100px;margin:auto}h1{font-size:22px}p{color:#b7cbd7;line-height:1.5}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}figure{margin:0;padding:10px;background:#102231;border:1px solid #34556a;border-radius:10px}img,video{display:block;width:100%;height:auto;border-radius:6px;background:#020a10}figcaption{margin-top:8px;color:#cde7f1;font-weight:700}pre{white-space:pre-wrap;background:#020a10;border:1px solid #254255;border-radius:8px;padding:12px;overflow:auto}a{color:#9eeaff}</style></head><body><main><h1>APEIRIA / WebGL render report</h1><p>GitHub Actions上のChromium + SwiftShaderで、実際のGLBをWebGL描画した結果です。枠付き画像で瞬き範囲を、動画で自動瞬きを確認できます。</p><p>commit: <code>" + esc(report.commit) + "</code><br>生成日時: <code>" + esc(report.generatedAt) + "</code><br>renderer: <code>" + esc(report.webgl.renderer) + "</code></p><h2>実アプリのWebGL</h2><div class="grid"><figure><img src="app-normal.png"><figcaption>実アプリ通常</figcaption></figure><figure><img src="app-both-closed.png"><figcaption>実アプリ両目閉じ</figcaption></figure><figure><img src="app-positive.png"><figcaption>実アプリ・ポジティブジェスチャー</figcaption></figure></div><h2>瞬き範囲付き</h2><div class=\"grid\"><figure><img src=\"normal-debug.png\"><figcaption>通常</figcaption></figure><figure><img src=\"left-closed-debug.png\"><figcaption>左目を閉じる</figcaption></figure><figure><img src=\"right-closed-debug.png\"><figcaption>右目を閉じる</figcaption></figure><figure><img src=\"both-closed-debug.png\"><figcaption>両目を閉じる</figcaption></figure></div><h2>枠なし</h2><div class=\"grid\"><figure><img src=\"normal.png\"><figcaption>通常</figcaption></figure><figure><img src=\"left-closed.png\"><figcaption>左目を閉じる</figcaption></figure><figure><img src=\"right-closed.png\"><figcaption>右目を閉じる</figcaption></figure><figure><img src=\"both-closed.png\"><figcaption>両目を閉じる</figcaption></figure></div><h2>自動瞬き</h2><video controls loop muted playsinline src=\"blink.webm\"></video><p><a href=\"blink.gif\">GIF版を開く</a> · <a href=\"report.json\">診断JSONを開く</a> · <a href=\"../webgl-blink-calibration.html\">検証ページへ戻る</a></p><h2>診断</h2><pre>" + esc(JSON.stringify(report, null, 2)) + "</pre></main></body></html>");
            fs.rmSync(frames, { recursive: true, force: true });
            if (pageErrors.length || appErrors.length) throw new Error("WebGL page errors: " + pageErrors.concat(appErrors).join(" | "));
          } finally {
            await browser.close();
          }
          })().catch(error => { console.error(error.stack || error); process.exitCode = 1; });
          NODE
      - name: Publish render report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f render-output
          if git diff --cached --quiet; then
            echo "No render report changes"
          else
            git commit -m "Update WebGL render report [skip ci]"
            git push origin HEAD:main
          fi
