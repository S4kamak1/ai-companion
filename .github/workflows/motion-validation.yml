name: Motion validation








on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "motion-test.html"
      - "apeiria_front_2p5d_upright.glb"
      - ".github/workflows/motion-validation.yml"
  workflow_dispatch:








jobs:
  webgl-motion:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install browser test tools
        run: |
          npm init -y
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/ai-companion-http.log 2>&1 &
          echo $! > /tmp/ai-companion-http.pid
      - name: Run WebGL and motion checks
        run: |
          node <<'NODE'
          const { chromium } = require("playwright");
          const fs = require("node:fs");
          fs.mkdirSync("artifacts", { recursive: true });
          (async () => {
            const browser = await chromium.launch({
              headless: true,
              args: [
                "--use-angle=swiftshader",
                "--enable-unsafe-swiftshader",
                "--ignore-gpu-blocklist"
              ]
            });
            try {
              const page = await browser.newPage({ viewport: { width: 1000, height: 900 }, deviceScaleFactor: 1 });
              const consoleErrors = [];
              page.on("pageerror", e => consoleErrors.push("pageerror: " + e.message));
              page.on("console", m => { if (m.type() === "error") consoleErrors.push("console: " + m.text()); });
              await page.goto("http://127.0.0.1:4173/index.html", { waitUntil: "networkidle", timeout: 120000 });
              await page.waitForFunction(() => {
                const text = document.querySelector("#stateText")?.textContent || "";
                return /正面2.5Dモデル表示中|2.5Dモデル読込済み/.test(text);
              }, null, { timeout: 120000 });
              const webgl = await page.evaluate(() => {
                const canvas = document.querySelector("#stage canvas");
                const gl = canvas ? (canvas.getContext("webgl2") || canvas.getContext("webgl")) : null;
                return {
                  canvas: Boolean(canvas),
                  webgl: Boolean(gl),
                  status: document.querySelector("#stateText")?.textContent || ""
                };
              });
              await page.waitForFunction(() => Boolean(window.__apeiriaBlinkDiagnostics?.().textureReady), null, { timeout: 120000 });
              const autoBefore = await page.evaluate(() => window.__apeiriaBlinkDiagnostics().autoCount || 0);
              await page.waitForFunction(before => (window.__apeiriaBlinkDiagnostics?.().autoCount || 0) > before, autoBefore, { timeout: 10000 });
              const autoBlink = await page.evaluate(() => window.__apeiriaBlinkDiagnostics());
              if ((autoBlink.autoCount || 0) <= autoBefore || !(autoBlink.lastBlinkAt > 0)) throw new Error("Autonomous blink did not trigger: " + JSON.stringify(autoBlink));
              const blink = await page.evaluate(() => window.__apeiriaBlinkTest(1));
              const expectedBlink = { l: { x: -.052, y: .730, w: .060, h: .038 }, r: { x: .031, y: .716, w: .055, h: .038 } };
              const sameAnchor = (a, b) => ['x', 'y', 'w', 'h'].every(k => Math.abs(a[k] - b[k]) < .001);
              if (!blink.textureReady || blink.textureTargets < 2) throw new Error('Face motion layers were not initialized: ' + JSON.stringify(blink));
              if (blink.coordinateSystem !== 'model-local') throw new Error('Blink layers are not using model-local coordinates: ' + JSON.stringify(blink));
              if (!blink.texture?.width || !blink.texture?.height) throw new Error('Face texture metadata is missing: ' + JSON.stringify(blink.texture));
              for (const key of ['l', 'r']) {
                const stat = blink.stats?.eyes?.[key];
                if (!sameAnchor(blink.config?.[key], expectedBlink[key])) throw new Error('Blink anchor mismatch for ' + key + ': ' + JSON.stringify(blink.config?.[key]));
                if (!stat || !stat.expected || Math.abs(stat.expected[0] - expectedBlink[key].x) > .001 || Math.abs(stat.expected[1] - expectedBlink[key].y) > .001) throw new Error('Blink layer anchor mismatch for ' + key + ': ' + JSON.stringify(stat));
                if (stat.changed < 1 || !stat.centroid || stat.centroidError > 6) throw new Error('Blink render mismatch for ' + key + ': ' + JSON.stringify(stat));
              }
              await page.evaluate(() => window.__apeiriaBlinkTest(0));
              await page.screenshot({ path: "artifacts/webgl-index.png" });
              if (!webgl.canvas || !webgl.webgl) throw new Error("WebGL renderer was not created: " + JSON.stringify(webgl));
              if (!/正面2.5Dモデル表示中/.test(webgl.status)) throw new Error("Model did not reach WebGL display state: " + webgl.status);
              if (consoleErrors.length) throw new Error("WebGL page errors: " + consoleErrors.join(" | "));
              const motion = await browser.newPage({ viewport: { width: 720, height: 900 }, deviceScaleFactor: 1 });
              await motion.goto("http://127.0.0.1:4173/motion-test.html", { waitUntil: "networkidle", timeout: 120000 });
              await motion.waitForFunction(() => !document.querySelector("#t")?.disabled, null, { timeout: 120000 });
              await motion.getByRole("button", { name: "Run test" }).click();
              await motion.waitForFunction(() => Boolean(window.__motionTestResult), null, { timeout: 30000 });
              const motionResult = await motion.evaluate(() => ({
                status: document.body.innerText.includes("PASS: left/right motion regions isolated") ? "PASS" : "FAIL",
                result: window.__motionTestResult
              }));
              await motion.screenshot({ path: "artifacts/motion-test.png" });
              if (motionResult.status !== "PASS") throw new Error("Motion test failed: " + JSON.stringify(motionResult));
              fs.writeFileSync("artifacts/motion-report.json", JSON.stringify({ webgl, autoBlink, blink, motion: motionResult }, null, 2));
              console.log(JSON.stringify({ webgl, autoBlink, blink, motion: motionResult }, null, 2));
            } finally {
              await browser.close();
            }
          })().catch(error => { console.error(error.stack || error); process.exitCode = 1; });
          NODE
      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: motion-validation-artifacts
          path: artifacts/
          if-no-files-found: ignore
