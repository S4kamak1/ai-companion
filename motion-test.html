<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>APEIRIA motion test</title>
<style>body{margin:0;padding:14px;background:#07101a;color:#eaf7ff;font:14px system-ui}main{max-width:780px;margin:auto}canvas{display:block;width:min(100%,360px);height:auto;margin:auto;background:#102231;border:1px solid #34556a}button{margin:8px 4px 0 0;padding:9px 12px;border:1px solid #4aafc6;border-radius:8px;background:#153445;color:#d8f7ff;font-weight:700}button:first-of-type{background:#64ddf7;color:#04131c}button:disabled{opacity:.45}#s{margin-top:8px;padding:8px;border:1px solid #34556a;border-radius:8px}pre{white-space:pre-wrap;min-height:100px;padding:8px;background:#020a10;border:1px solid #254255;border-radius:8px}a{color:#9eeaff}</style>
<main><h2>APEIRIA / 2.5D motion test</h2><p>Canvas 2D fallback works when cloud WebGL is disabled.</p><canvas id="c" width="512" height="768"></canvas><div id="s">Loading GLB texture...</div><button id="t" disabled>Run test</button><button id="b" disabled>Blink</button><button id="m" disabled>Mouth</button><pre id="r">Waiting...</pre><a href="./index.html">Back to app</a></main>
<script>
const c=document.querySelector('#c'),x=c.getContext('2d'),b=document.createElement('canvas'),y=b.getContext('2d'),S=document.querySelector('#s'),R=document.querySelector('#r'),T=document.querySelector('#t'),B=document.querySelector('#b'),M=document.querySelector('#m'),P=384,expected={l:[-.067,.733,.105,.060],r:[.036,.733,.095,.058]},g={l:[-.067,.733,.105,.060],r:[.036,.733,.095,.058],m:[-.014,.671,.016,.007]},p=(a,z)=>[(a+2/3)*P,(1-z)*P];b.width=512;b.height=768;let ready=false,img,raf=0;
function color(a,z){const[u,v]=p(a,z),d=y.getImageData(u|0,v|0,1,1).data;return'rgb('+d[0]+','+d[1]+','+d[2]+')'}
function ellipse(a,k,col,alpha){const[u,v]=p(a[0],a[1]);x.save();x.globalAlpha=alpha;x.fillStyle=col;x.beginPath();x.ellipse(u,v,a[2]*P*k/2,a[3]*P*k/2,0,0,7);x.fill();x.restore()}
function draw(blink=0,mouth=0){if(!ready)return;x.clearRect(0,0,512,768);x.drawImage(b,0,0);if(blink){ellipse(g.l,1-.88*blink,color(g.l[0],g.l[1]+.02),.97);ellipse(g.r,1-.88*blink,color(g.r[0],g.r[1]+.02),.97)}if(mouth)ellipse(g.m,1,'#b8758b',.24+.16*mouth)}
function data(){return x.getImageData(0,0,512,768).data}
function eye(u,v){return[g.l,g.r].some(a=>{const[cx,cy]=p(a[0],a[1]),rx=a[2]*P/2+3,ry=a[3]*P/2+3;return((u-cx)/rx)**2+((v-cy)/ry)**2<1})}
function mouth(u,v){const[cx,cy]=p(g.m[0],g.m[1]),rx=g.m[2]*P/2+4,ry=g.m[3]*P+4;return((u-cx)/rx)**2+((v-cy)/ry)**2<1}
function diff(a,z,allow){let changed=0,out=0;for(let v=0;v<768;v++)for(let u=0;u<512;u++){const i=(v*512+u)*4,d=Math.abs(a[i]-z[i])+Math.abs(a[i+1]-z[i+1])+Math.abs(a[i+2]-z[i+2]);if(d>18){changed++;if(!allow(u,v))out++}}return[changed,out]}
function blinkDiff(a,z){const per={l:{changed:0,sx:0,sy:0},r:{changed:0,sx:0,sy:0}};let changed=0,outside=0;for(let v=0;v<768;v++)for(let u=0;u<512;u++){const i=(v*512+u)*4,d=Math.abs(a[i]-z[i])+Math.abs(a[i+1]-z[i+1])+Math.abs(a[i+2]-z[i+2]);if(d<=18)continue;changed++;let hit=false;for(const key of ['l','r']){const a0=g[key],[cx,cy]=p(a0[0],a0[1]),rx=a0[2]*P/2+3,ry=a0[3]*P/2+3;if(((u-cx)/rx)**2+((v-cy)/ry)**2<1){hit=true;per[key].changed++;per[key].sx+=u;per[key].sy+=v}}if(!hit)outside++}for(const key of ['l','r']){const a0=g[key],q=per[key],[cx,cy]=p(a0[0],a0[1]);q.expected=[cx,cy];q.centroid=q.changed?[q.sx/q.changed,q.sy/q.changed]:null;q.centroidError=q.centroid?Math.hypot(q.centroid[0]-cx,q.centroid[1]-cy):Infinity;delete q.sx;delete q.sy}return{changed,outside,per}}
function calibration(){const check=(a,b)=>({dx:a[0]-b[0],dy:a[1]-b[1],dw:a[2]-b[2],dh:a[3]-b[3]});return{l:check(g.l,expected.l),r:check(g.r,expected.r)}}
function test(){draw();const base=data();draw(1);const blink=blinkDiff(base,data());draw(0,1);const[mc,mo]=diff(base,data(),mouth);draw();const cal=calibration(),result={mode:'canvas-2d',blinkChangedPixels:blink.changed,mouthChangedPixels:mc,maxChangedPixelsOutsideEyes:blink.outside,maxChangedPixelsOutsideMouth:mo,leftEye:blink.per.l,rightEye:blink.per.r,calibration:cal};const close=v=>Math.abs(v.dx)<.001&&Math.abs(v.dy)<.001&&Math.abs(v.dw)<.001&&Math.abs(v.dh)<.001;const pass=blink.changed>0&&blink.per.l.changed>0&&blink.per.r.changed>0&&blink.outside===0&&blink.per.l.centroidError<6&&blink.per.r.centroidError<6&&mc>0&&mo===0&&close(cal.l)&&close(cal.r);R.textContent=JSON.stringify(result,null,2);S.textContent=pass?'PASS: left/right motion regions isolated':'FAIL: inspect left/right eye calibration';S.style.color=pass?'#b8ffd9':'#ffd1d8';return result}
function play(kind){cancelAnimationFrame(raf);const start=performance.now(),frame=now=>{const t=(now-start)/1000;if(t<1.3){if(kind==='blink'){const q=t<.16?t/.16:t<.5?Math.max(0,(.5-t)/.34):0;draw(q)}else draw(0,t<1?Math.abs(Math.sin(t*7))*.9:0);raf=requestAnimationFrame(frame)}else draw()};raf=requestAnimationFrame(frame)}
T.onclick=()=>{window.__motionTestResult=test()};B.onclick=()=>play('blink');M.onclick=()=>play('mouth');window.runMotionTest=test;
async function load(){const buf=await fetch('./apeiria_front_2p5d_upright.glb').then(r=>r.arrayBuffer()),dv=new DataView(buf);let off=12,json,bin;while(off<buf.byteLength){const n=dv.getUint32(off,true),type=dv.getUint32(off+4,true),chunk=buf.slice(off+8,off+8+n);if(type===0x4e4f534a)json=JSON.parse(new TextDecoder().decode(chunk));if(type===0x004e4942)bin=chunk;off+=8+n}const im=json.images[0],bv=json.bufferViews[im.bufferView],blob=URL.createObjectURL(new Blob([bin.slice(bv.byteOffset||0,(bv.byteOffset||0)+bv.byteLength)],{type:im.mimeType})),image=new Image();image.onload=()=>{y.save();y.translate(0,768);y.scale(1,-1);y.drawImage(image,0,0,512,768);y.restore();ready=true;draw();T.disabled=B.disabled=M.disabled=false;S.textContent='Ready (Canvas 2D; WebGL not required)';R.textContent='Ready. Click Run test.'};image.src=blob}
load().catch(e=>{S.textContent='GLB load failed: '+e.message});
</script>
