:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;padding:16px;background:#07101a;color:#eaf7ff;font:14px system-ui,-apple-system,"Segoe UI",sans-serif}main{max-width:900px;margin:auto}h1{font-size:20px;margin:0 0 6px}p{color:#b7cbd7;line-height:1.5;margin:6px 0 12px}.tools{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0}.tools button{padding:9px 12px;border:1px solid #4aafc6;border-radius:9px;background:#153445;color:#d8f7ff;font-weight:700;cursor:pointer}.tools button:hover{background:#24546a}.tools button:disabled{opacity:.45;cursor:default}.tools label{display:flex;align-items:center;gap:5px;padding:8px 10px;border:1px solid #34556a;border-radius:9px;color:#cde7f1}.stage{position:relative;width:min(100%,560px);aspect-ratio:4/5;margin:12px auto;background:#102231;border:1px solid #34556a;border-radius:10px;overflow:hidden}.stage canvas{display:block;width:100%;height:100%}#status{padding:9px 11px;border:1px solid #34556a;border-radius:9px;background:#020a10;color:#cde7f1}#status.ok{border-color:#43c991;color:#b8ffd9}#status.fail{border-color:#df7081;color:#ffd1d8}pre{white-space:pre-wrap;word-break:break-word;min-height:170px;padding:10px;background:#020a10;border:1px solid #254255;border-radius:9px;color:#d8f7ff}a{color:#9eeaff}small{color:#91a9b8}
</style></head><body><main><h1>APEIRIA / WebGL blink calibration</h1><p>現行のmodel-local瞬きレイヤーを、実際のWebGL描画で確認します。青枠=左目、桃枠=右目。通常・片目・両目・自動瞬きを個別に確認できます。</p><div id="status">GLBとWebGLを読み込み中…</div><div class="tools"><button id="normal" disabled>通常</button><button id="left" disabled>左目を閉じる</button><button id="right" disabled>右目を閉じる</button><button id="both" disabled>両目を閉じる</button><button id="auto" disabled>自動瞬き</button><button id="record" disabled>3秒WebM記録</button><label><input id="debug" type="checkbox" checked>範囲枠</label></div><div class="stage"><canvas id="gl"></canvas></div><pre id="diag">診断情報を表示します。</pre><a href="./index.html">アプリへ戻る</a><br><small>このページは公開アプリ本体のコードを変更せず、表示位置の検証だけを行います。</small></main>
<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";
import {GLTFLoader} from "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/GLTFLoader.js";
const $=s=>document.querySelector(s),stage=$(".stage"),canvas=$("#gl"),status=$("#status"),diag=$("#diag"),config={l:{x:-.052,y:.730,w:.060,h:.038},r:{x:.031,y:.716,w:.055,h:.038}};
let renderer,scene,camera,root,model,faceRig,layers={l:null,r:null},boxes={l:null,r:null},sourceImage=null,auto=false,autoAt=0,last={l:0,r:0};
function setStatus(t,kind){status.textContent=t;status.className=kind||""}
function patchTexture(eye){const c=document.createElement("canvas");c.width=192;c.height=128;const q=c.getContext("2d");let col={r:242,g:211,b:202};if(sourceImage){const s=document.createElement("canvas");s.width=sourceImage.width||1024;s.height=sourceImage.height||1536;const z=s.getContext("2d");z.drawImage(sourceImage,0,0,s.width,s.height);const px=Math.max(0,Math.round((eye.x+2/3)*s.width*.75-32)),py=Math.max(0,Math.round((eye.y+1)*s.height/2-54)),d=z.getImageData(px,py,64,40).data;let r=0,g=0,b=0,n=0;for(let i=0;i<d.length;i+=4)if(d[i+3]>180&&d[i]>170&&d[i+1]>120&&d[i+2]>110&&d[i]>d[i+1]&&d[i+1]>d[i+2]){r+=d[i];g+=d[i+1];b+=d[i+2];n++}if(n)col={r:Math.round(r/n),g:Math.round(g/n),b:Math.round(b/n)}}const grad=q.createRadialGradient(96,64,8,96,64,92);grad.addColorStop(0,"rgba("+Math.min(255,col.r+2)+","+Math.min(255,col.g+1)+","+col.b+",.98)");grad.addColorStop(.72,"rgba("+col.r+","+col.g+","+col.b+",.92)");grad.addColorStop(1,"rgba("+col.r+","+col.g+","+col.b+",0)");q.beginPath();q.moveTo(10,65);q.bezierCurveTo(34,49,64,43,96,46);q.bezierCurveTo(128,43,158,49,182,65);q.bezierCurveTo(158,78,128,83,96,82);q.bezierCurveTo(64,83,34,78,10,65);q.closePath();q.fillStyle=grad;q.fill();q.strokeStyle="rgba(86,61,76,.66)";q.lineWidth=2.4;q.lineCap="round";q.beginPath();q.moveTo(13,65);q.quadraticCurveTo(96,40,179,65);q.stroke();q.strokeStyle="rgba(86,61,76,.52)";q.lineWidth=1.7;q.beginPath();if(eye.x<0){q.moveTo(13,65);q.lineTo(4,61)}else{q.moveTo(179,65);q.lineTo(188,61)}q.stroke();const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t}function blinkLayer(parent,eye){const m=new THREE.Mesh(new THREE.PlaneGeometry(eye.w,eye.h),new THREE.MeshBasicMaterial({map:patchTexture(eye),transparent:true,opacity:0,depthTest:false,depthWrite:false,toneMapped:false}));m.position.set(eye.x,eye.y,.026);m.renderOrder=30;parent.add(m);return m}
function box(parent,eye,color){const p=[new THREE.Vector3(eye.x-eye.w/2,eye.y-eye.h/2,.030),new THREE.Vector3(eye.x+eye.w/2,eye.y-eye.h/2,.030),new THREE.Vector3(eye.x+eye.w/2,eye.y+eye.h/2,.030),new THREE.Vector3(eye.x-eye.w/2,eye.y+eye.h/2,.030)];const l=new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(p),new THREE.LineBasicMaterial({color,transparent:true,opacity:.95,depthTest:false,depthWrite:false}));l.renderOrder=40;parent.add(l);return l}
function buildFace(){faceRig=new THREE.Group();faceRig.position.z=.018;model.add(faceRig);layers.l=blinkLayer(faceRig,config.l);layers.r=blinkLayer(faceRig,config.r);boxes.l=box(faceRig,config.l,0x65ddff);boxes.r=box(faceRig,config.r,0xffb3c9);paint(0,0)}
function paint(l,r){last={l:Math.max(0,Math.min(1,l)),r:Math.max(0,Math.min(1,r))};for(const k of ["l","r"]){const v=last[k],m=layers[k];m.material.opacity=Math.min(1,v*1.35);m.scale.y=.16+.84*v;m.visible=v>.001;boxes[k].visible=$("#debug").checked}diag.textContent=JSON.stringify({webgl:true,renderer:renderer.getContext().getParameter(renderer.getContext().RENDERER),mode:auto?"auto":"manual",blink:last,config,canvas:{width:canvas.width,height:canvas.height}},null,2)}
function resize(){if(!renderer)return;const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}
function value(t){const p=t%3.8;if(p<1.2)return 0;if(p<1.36)return(p-1.2)/.16;if(p<1.44)return 1;if(p<1.68)return 1-(p-1.44)/.24;return 0}
function tick(now){requestAnimationFrame(tick);if(auto){const t=(now-autoAt)/1000;const v=value(t);paint(v,Math.max(0,value(t-.035)))}if(renderer)renderer.render(scene,camera)}
function enable(){for(const id of ["normal","left","right","both","auto","record"])$("#"+id).disabled=false;setStatus("WebGL表示準備完了。範囲枠を見ながら各状態を確認してください。","ok");paint(0,0)}
$("#normal").onclick=()=>{auto=false;paint(0,0)};$("#left").onclick=()=>{auto=false;paint(1,0)};$("#right").onclick=()=>{auto=false;paint(0,1)};$("#both").onclick=()=>{auto=false;paint(1,1)};$("#auto").onclick=()=>{auto=true;autoAt=performance.now();setStatus("自動瞬きを再生中。枠からのはみ出しを確認してください。","ok")};$("#debug").onchange=()=>paint(last.l,last.r);
$("#record").onclick=()=>{if(!canvas.captureStream||!window.MediaRecorder){setStatus("このブラウザはWebM記録に対応していません。","fail");return}const rec=new MediaRecorder(canvas.captureStream(30),{mimeType:"video/webm"}),chunks=[];rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};rec.onstop=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(chunks,{type:"video/webm"}));a.download="apeiria-webgl-blink-test.webm";a.textContent="WebMをダウンロード";a.style.display="block";a.style.marginTop="8px";document.querySelector("main").appendChild(a);setStatus("WebM記録完了。実際のWebGLフレームを確認できます。","ok")};rec.start();auto=true;autoAt=performance.now();setTimeout(()=>{auto=false;rec.stop();paint(0,0)},3000)};
try{renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:false,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));renderer.outputColorSpace=THREE.SRGBColorSpace;scene=new THREE.Scene();scene.background=new THREE.Color(0x061019);camera=new THREE.PerspectiveCamera(32,1,.01,100);camera.position.set(0,.20,4.8);camera.lookAt(0,.24,0);scene.add(new THREE.HemisphereLight(0xeaf8ff,0x16253b,2.2));const key=new THREE.DirectionalLight(0xffffff,2.8);key.position.set(3,7,6);scene.add(key);const fill=new THREE.PointLight(0x49dfff,2,10);fill.position.set(-3,1,3);scene.add(fill);root=new THREE.Group();scene.add(root);resize();new GLTFLoader().load("./apeiria_front_2p5d_upright.glb",g=>{model=g.scene;model.scale.setScalar(1.45);model.position.set(0,.04,0);root.add(model);model.traverse(o=>{const mats=Array.isArray(o.material)?o.material:[o.material];for(const mat of mats)if(mat&&mat.map&&mat.map.image&&!sourceImage)sourceImage=mat.map.image});buildFace();enable()},undefined,e=>setStatus("GLB読み込みエラー: "+e.message,"fail"));addEventListener("resize",resize);requestAnimationFrame(tick)}catch(e){setStatus("WebGL初期化エラー: "+e.message,"fail")}
</script></body></html>
